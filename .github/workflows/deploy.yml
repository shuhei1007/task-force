name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 検索データを生成
        run: node scripts/build-search-index.mjs

      - name: 公開ファイルを準備
        run: |
          mkdir _site
          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".vscode" \
            --exclude="_site" \
            --exclude="scripts" \
            ./ _site/
          touch _site/.nojekyll

      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5

      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
