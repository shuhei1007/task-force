<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- cSpell:ignore InstaCircle PDCA NISA -->
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/images/強化チームロゴ.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュール | Instagram Circle Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=1787305000011">
</head>

<body>

    <!-- トップバー -->
    <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="メニューを開く">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <a href="index.html" class="logo">
            <img src="assets/images/強化チームロゴ.png" alt="強化チームロゴ" width="120" height="80">
        </a>
    </header>

    <!-- サイドバーオーバーレイ -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- サイドバー -->
    <aside class="sidebar" id="sidebar">
        <nav class="menu">
            <button class="accordion-btn">
                <span>メインメニュー</span>
                <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="accordion-content">
                <a href="news.html" class="menu-item" data-page="news">お知らせ</a>
                <a href="knowledge.html" class="menu-item" data-page="knowledge">ノウハウ一覧</a>
                <a href="members.html" class="menu-item" data-page="members">メンバー一覧</a>
                <a href="prompts.html" class="menu-item" data-page="prompts">プロンプト集</a>
                <a href="radio.html" class="menu-item" data-page="radio">ラジオ集</a>
                <a href="live.html" class="menu-item" data-page="live">ライブ集</a>
            </div>

            <button class="accordion-btn">
                <span>その他</span>
                <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="accordion-content">
                <a href="resources.html" class="menu-item" data-page="resources">リソース</a>
                <a href="schedule.html" class="menu-item" data-page="schedule">スケジュール</a>
                <a href="links.html" class="menu-item" data-page="links">関連リンク</a>
            </div>
        </nav>
    </aside>

    <!-- メインコンテンツ -->
    <main class="main-content" id="app">
        <div class="page-header gs-item">
            <h1>スケジュール</h1>
        </div>

        <div class="schedule-container">
            <!-- iサークル予定 -->
            <section class="schedule-section gs-item">
                <div class="schedule-section-head">
                    <h2><span class="icon">📅</span> iサークル予定</h2>
                    <div class="month-tabs" role="tablist" aria-label="予定月の切り替え">
                        <button type="button" class="month-tab active" role="tab" aria-selected="true" data-month="08">8月</button>
                        <button type="button" class="month-tab" role="tab" aria-selected="false" data-month="09">9月</button>
                    </div>
                </div>
                <div class="schedule-image-wrap">
                    <img id="icircle-schedule-img"
                        src="assets/images/schedule-08.png"
                        alt="iサークル 8月の予定"
                        width="3102"
                        height="1860"
                        data-src-08="assets/images/schedule-08.png"
                        data-src-09="assets/images/schedule-09.png">
                </div>
            </section>

            <!-- 強化チーム予定 -->
            <section class="schedule-section gs-item">
                <h2><span class="icon">✍️</span> 9月の予定</h2>
                <div class="table-responsive">
                    <table class="schedule-table" aria-label="9月の予定">
                        <thead>
                            <tr>
                                <th>開催日</th>
                                <th>内容</th>
                                <th>カレンダー登録</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Animation & ScrollTrigger Libraries -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Custom JS -->
    <script defer src="js/theme.js"></script>
    <script defer src="js/main.js"></script>



</body>

</html>
